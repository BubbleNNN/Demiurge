name: Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Build public Windows x64 package
        run: MORI_QUIET=1 node scripts/package-windows.cjs --skip-build --public
      - name: Verify ZIP and bundled pet catalogue
        run: |
          python3 - <<'PY'
          import glob, zipfile, json, hashlib
          files=glob.glob('release/Demiurge-*-windows-x64.zip')
          assert len(files)==1
          file=files[0]
          with zipfile.ZipFile(file) as z:
              assert z.testzip() is None
              prefix=file.split('/')[-1][:-4]+'/'
              app=prefix+'resources/app/'
              pack=json.loads(z.read(app+'shared/cyrene-motion-pack.json'))
              assert len(pack['entries'])==1
              entry=pack['entries'][0]
              assert entry['builtin']=='cyrene-chibi-v6'
              expected={entry['file'],*entry['pageFiles'],'cyrene-chibi-v6-reference.png'}
              actual={p[len(app+'dist/art/'):] for p in z.namelist() if p.startswith(app+'dist/art/') and p.endswith('.png')}
              assert actual==expected
              manifest=json.loads(z.read(prefix+'package-manifest.json'))
              for item in manifest['payload']:
                  assert 'link' not in item, 'Windows ZIP must not rely on Unix symlinks'
                  blob=z.read(app+item['path'])
                  assert len(blob)==item['bytes']
                  assert hashlib.sha256(blob).hexdigest()==item['sha256']
              assert not manifest['tested']
          digest=hashlib.sha256(open(file,'rb').read()).hexdigest()
          assert open(file+'.sha256').read().split()[0]==digest
          print('Verified ZIP, full payload hashes and one bundled pet. Windows runtime untested.')
          PY
      - name: Upload to the existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" release/Demiurge-*-windows-x64.zip release/Demiurge-*-windows-x64.zip.sha256 --clobber
